<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- added to a phone's home screen (iPhone Safari, Android Chrome): full screen, its own name -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Choosen" />
    <meta name="theme-color" content="#0e0f11" />
    <title>Choosen V3</title>
    <!-- the app's logo for the window, taskbar and tab (served by the app at the top: /icon.png) -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <style>
      /* The Android app's launch screen (the app serves this page with class="app"): the blue icon on
         plain white, its cards settle and the star pops; src/lib/hello.ts lets it go. */
      #hello {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 380ms ease;
      }
      html:not(.app) #hello,
      #hello[hidden] {
        display: none;
      }
      #hello.out {
        opacity: 0;
        pointer-events: none;
      }
      #hello .h-mark {
        position: relative;
        width: 240px;
        height: 240px;
      }
      #hello .h-ring {
        position: absolute;
        inset: 40px;
        border-radius: 50%;
        background: #0096fa;
      }
      #hello svg {
        position: absolute;
        inset: 0;
        width: 240px;
        height: 240px;
      }
      #hello .h-back,
      #hello .h-front,
      #hello .h-star {
        transform-box: fill-box;
        transform-origin: center;
      }
      #hello .h-name {
        margin-top: -18px;
        color: #0096fa;
        font: 800 26px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
        opacity: 0;
      }
      #hello.go .h-ring {
        animation: h-ring 900ms ease-out forwards;
      }
      #hello.go .h-back {
        animation: h-back 700ms cubic-bezier(0.3, 0.7, 0.3, 1);
      }
      #hello.go .h-front {
        animation: h-front 700ms cubic-bezier(0.3, 0.7, 0.3, 1);
      }
      #hello.go .h-star {
        animation: h-star 620ms 180ms cubic-bezier(0.3, 1.6, 0.5, 1) both;
      }
      #hello.go .h-name {
        animation: h-name 520ms 260ms ease-out forwards;
      }
      @keyframes h-ring {
        40% {
          scale: 1.05;
        }
      }
      @keyframes h-back {
        40% {
          rotate: -6deg;
          translate: -4px 1px;
        }
      }
      @keyframes h-front {
        40% {
          rotate: 6deg;
          translate: 4px -1px;
        }
      }
      @keyframes h-star {
        from {
          scale: 0.4;
          opacity: 0;
        }
      }
      @keyframes h-name {
        from {
          opacity: 0;
          translate: 0 8px;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="hello" class="go" aria-hidden="true">
      <div class="h-mark">
        <div class="h-ring"></div>
        <svg viewBox="0 0 108 108">
          <g transform="translate(54 54) scale(0.86) translate(-54 -54)">
            <g transform="rotate(-13 49 52)"><rect class="h-back" x="33" y="30" width="32" height="44" rx="4" fill="#ffffff" fill-opacity="0.55" /></g>
            <g transform="rotate(9 62 54)">
              <g class="h-front">
                <rect x="45" y="31" width="34" height="46" rx="4" fill="#ffffff" />
                <g transform="translate(51.8 43.9) scale(0.85)">
                  <path class="h-star" fill="#0096fa" d="M12 2.8l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17l-5.8 3.3 1.4-6.4-4.9-4.4 6.5-.7z" />
                </g>
              </g>
            </g>
          </g>
        </svg>
      </div>
      <b class="h-name">Choosen</b>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
